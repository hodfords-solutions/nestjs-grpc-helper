name: Test
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Cache protoc plugins
        id: plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/protoc-gen-prost
            ~/.cargo/bin/protoc-gen-tonic
            ~/go/bin/protoc-gen-go
            ~/go/bin/protoc-gen-go-grpc
          key: sdk-plugins-prost-0.4.0-tonic-0.4.1-go-1.36.6-gogrpc-1.5.1
      - name: Install protoc plugins
        if: steps.plugins.outputs.cache-hit != 'true'
        run: |
          cargo install protoc-gen-prost@0.4.0 --locked
          cargo install protoc-gen-tonic@0.4.1 --locked
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Add plugin directories to PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Cache the Rust build of the behavior consumer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/sdk-test-cargo-target
          key: sdk-behavior-cargo-${{ hashFiles('lib/constants/sdk-toolchain.const.ts', 'lib/templates/rust/cargo-toml.hbs', 'tests/sdk-behavior.spec.ts') }}
          restore-keys: |
            sdk-behavior-cargo-
      - run: pnpm install --frozen-lockfile
      - name: Generate the sample proto
        run: pnpm run build:sample-sdk
      - run: pnpm test
        env:
          SDK_INTEGRATION_REQUIRED: '1'
          SDK_TEST_CARGO_TARGET_DIR: ${{ runner.temp }}/sdk-test-cargo-target
